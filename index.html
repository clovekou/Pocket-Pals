<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pocket Pals">
<title>Pocket Pal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
// home-screen app: lets the CSS tell it apart from a Safari tab
if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('standalone');
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="nameBtn" class="glass namechip" aria-label="Open stat card">
      <span class="avatar"><img id="avatar" alt=""></span>
      <span class="nm"><b id="petName">Pocket Pal</b><small id="petSub"></small></span>
      <span id="petLevel" class="lv"></span>
    </button>
    <button id="friendsBtn" class="glass chip icon" aria-label="Pokégear: friends and trades"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M30.5 6.5l3.5-4.5" stroke="#2b2f45" stroke-width="3" stroke-linecap="round"/>
      <rect x="11" y="5" width="26" height="39" rx="7" fill="url(#dkBody)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M11 15v-3a7 7 0 0 1 7-7h12a7 7 0 0 1 7 7v3z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="17.5" cy="10.2" r="1.9" fill="#62c9ff"/><path d="M24 10h7" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
      <rect x="15" y="18" width="18" height="14" rx="2.5" fill="#8fe3c2" stroke="#2b2f45" stroke-width="2"/>
      <path d="M17.5 28.5h5v-6h8" fill="none" stroke="#3f9a78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="25.5" r="2" fill="#ef4b3f"/>
      <circle cx="24" cy="38" r="3.4" fill="#ffd86b" stroke="#2b2f45" stroke-width="2"/>
    </svg><i id="friendsBadge" class="badge hidden">0</i></button>
    <button id="settingsBtn" class="glass chip icon" aria-label="Settings"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <g fill="url(#dkSteel)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(0 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(45 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(90 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(135 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(180 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(225 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(270 24 24)"/><rect x="20.5" y="5" width="7" height="10" rx="1.8" transform="rotate(315 24 24)"/></g>
      <circle cx="24" cy="24" r="12.5" fill="url(#dkSteel)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="5" fill="#fff" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M16 19.5a9.5 9.5 0 0 1 5-4.5" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/>
    </svg></button>
  </header>

  <section id="bars" aria-label="Needs">
    <div class="bar glass" data-k="food" title="Food" aria-label="Food"><img class="px" data-icon="oran" alt=""><div class="bt"><div class="bh"><span class="bl">Food</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="joy" title="Happy" aria-label="Happy"><img class="px" data-icon="heart" alt=""><div class="bt"><div class="bh"><span class="bl">Happy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="ene" title="Energy" aria-label="Energy"><img class="px" data-icon="energy" alt=""><div class="bt"><div class="bh"><span class="bl">Energy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="hyg" title="Hygiene" aria-label="Hygiene"><img class="px" data-icon="hygiene" alt=""><div class="bt"><div class="bh"><span class="bl">Hygiene</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
  </section>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="cerBtns"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="hint"></div>
    <div id="talk" class="hidden" aria-live="polite">
      <div class="tk-face"><img alt=""></div>
      <div class="tk-box"><div class="tk-name"></div><div class="tk-text"></div><div class="tk-next">▼</div></div>
    </div>
  </main>

  <nav id="actions" class="glass dock">
    <!-- shared gradients for the dock icons -->
    <svg id="dkDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="dkBag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#f4a62a"/></linearGradient>
      <linearGradient id="dkRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset="1" stop-color="#e2382c"/></linearGradient>
      <linearGradient id="dkBall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset="1" stop-color="#e2382c"/></linearGradient>
      <linearGradient id="dkCare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9cbd"/><stop offset="1" stop-color="#f0507a"/></linearGradient>
      <linearGradient id="dkBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#535a7e"/><stop offset="1" stop-color="#2f3450"/></linearGradient>
      <linearGradient id="dkSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e5ef"/><stop offset="1" stop-color="#9aa1b8"/></linearGradient>
      <linearGradient id="dkScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbf1"/><stop offset="1" stop-color="#bfe9d2"/></linearGradient>
    </defs></svg>
    <button data-act="bag" aria-label="Bag"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M18 14v-2a6 6 0 0 1 12 0v2" fill="none" stroke="#2b2f45" stroke-width="3" stroke-linecap="round"/>
      <rect x="8" y="13" width="32" height="29" rx="9" fill="url(#dkBag)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="14.5" y="31" width="19" height="8" rx="3.5" fill="#fff4d6" stroke="#2b2f45" stroke-width="2"/>
      <path d="M8 23v-1a9 9 0 0 1 9-9h14a9 9 0 0 1 9 9v1z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M13 18.5a6 6 0 0 1 5-3h5" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="23" r="5.5" fill="#fff"/><path d="M18.5 23a5.5 5.5 0 0 1 11.0 0z" fill="url(#dkBall)"/><circle cx="24" cy="23" r="5.5" fill="none" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M18.5 23h11.0" stroke="#2b2f45" stroke-width="2.5"/><circle cx="24" cy="23" r="1.8" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
    </svg><span>Bag</span></button>
    <button data-act="care" aria-label="Care: feed, bath, sleep"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 41S9 32.6 9 21.6C9 15.7 13.2 12 18 12c2.7 0 4.8 1.3 6 3.3 1.2-2 3.3-3.3 6-3.3 4.8 0 9 3.7 9 9.6C39 32.6 24 41 24 41z" fill="url(#dkCare)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <ellipse cx="24" cy="29" rx="5.2" ry="4.2" fill="#fff"/>
      <circle cx="17.6" cy="23.4" r="2.2" fill="#fff"/><circle cx="21.4" cy="20" r="2.2" fill="#fff"/><circle cx="26.6" cy="20" r="2.2" fill="#fff"/><circle cx="30.4" cy="23.4" r="2.2" fill="#fff"/>
      <path d="M13.5 19.5a5 5 0 0 1 4-3.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
    </svg><span>Care</span></button>
    <button data-act="explore" class="center" aria-label="Explore: dungeon or training"><i class="hub"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="17" fill="#fff" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="12.5" fill="none" stroke="#d9dcea" stroke-width="1.5"/>
      <circle cx="24" cy="9.8" r="1.3" fill="#2b2f45"/><circle cx="24" cy="38.2" r="1.3" fill="#2b2f45"/><circle cx="9.8" cy="24" r="1.3" fill="#2b2f45"/><circle cx="38.2" cy="24" r="1.3" fill="#2b2f45"/>
      <g transform="rotate(35 24 24)"><path d="M24 12.5l4.6 11.5h-9.2z" fill="#ef4b3f"/><path d="M24 35.5l4.6-11.5h-9.2z" fill="#5d6fb3"/></g>
      <circle cx="24" cy="24" r="2.4" fill="#fff" stroke="#2b2f45" stroke-width="1.8"/>
    </svg></i><span>Explore</span></button>
    <button data-act="party" aria-label="Party"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="14" cy="19" r="8.5" fill="#fff"/><path d="M5.5 19a8.5 8.5 0 0 1 17.0 0z" fill="url(#dkBall)"/><circle cx="14" cy="19" r="8.5" fill="none" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M5.5 19h17.0" stroke="#2b2f45" stroke-width="2.5"/><circle cx="14" cy="19" r="2.7" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/><circle cx="34" cy="19" r="8.5" fill="#fff"/><path d="M25.5 19a8.5 8.5 0 0 1 17.0 0z" fill="url(#dkBall)"/><circle cx="34" cy="19" r="8.5" fill="none" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M25.5 19h17.0" stroke="#2b2f45" stroke-width="2.5"/><circle cx="34" cy="19" r="2.7" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/><circle cx="24" cy="31" r="10.5" fill="#fff"/><path d="M13.5 31a10.5 10.5 0 0 1 21.0 0z" fill="url(#dkBall)"/><circle cx="24" cy="31" r="10.5" fill="none" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M13.5 31h21.0" stroke="#2b2f45" stroke-width="2.5"/><circle cx="24" cy="31" r="3.4" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
    </svg><span>Party</span></button>
    <button data-act="dex" aria-label="Pokédex"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="9" y="6" width="30" height="37" rx="7" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="17" cy="14.5" r="4.6" fill="#62c9ff" stroke="#fff" stroke-width="2"/>
      <circle cx="15.8" cy="13.3" r="1.3" fill="#fff"/>
      <circle cx="26" cy="12" r="1.8" fill="#ffd86b"/><circle cx="31.5" cy="12" r="1.8" fill="#7fdc6c"/>
      <rect x="14" y="22" width="20" height="15" rx="3.5" fill="url(#dkScreen)" stroke="#2b2f45" stroke-width="2"/>
      <path d="M18 27.5h12M18 32h8" stroke="#5aa57d" stroke-width="2" stroke-linecap="round"/>
    </svg><span>Dex</span></button>
  </nav>
</div>

<!-- bottom sheet / dialogs -->
<div id="scrim" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>

<!-- full-screen minigames -->
<div id="arena" class="hidden">
  <div class="arena-top">
    <div id="arenaTitle"></div>
    <div id="arenaInfo"></div>
    <button id="arenaClose" class="glass chip icon" aria-label="Stop">✕</button>
  </div>
  <canvas id="arenaCanvas"></canvas>
  <div id="arenaPanel" class="hidden"><div class="ep-msg" id="epMsg"></div><div class="ep-btns" id="epBtns"></div></div>
</div>

<script>window.PP_PREVIEW = /[?&]preview\b/.test(location.search); // ?preview = sample team, offline, separate save</script>
<script src="items.js"></script>
<script src="evodata.js"></script>
<script src="species.js"></script>
<script src="evolution.js"></script>
<script src="pixelart.js"></script>
<script src="sprites.js"></script>
<script src="backgrounds.js"></script>
<script src="creatures.js"></script>
<script src="game.js"></script>
<script src="online-config.js"></script>
<script src="online.js"></script>
<script src="talk.js"></script>
<script src="ui.js"></script>
</body>
</html>
