<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e3350d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Pal">
<title>Pocket Pal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="nameBtn" class="glass namechip" aria-label="Open stat card">
      <span class="avatar"><img id="avatar" alt=""></span>
      <span class="nm"><b id="petName">Pocket Pal</b><small id="petSub"></small></span>
      <span id="petLevel" class="lv"></span>
    </button>
    <button id="streak" class="glass chip" title="Daily care streak"><img class="px" data-icon="flame" alt=""><b id="streakNum">0</b></button>
    <button id="settingsBtn" class="glass chip icon" aria-label="Settings"><img class="px" data-icon="gear" alt=""></button>
  </header>

  <section id="bars" aria-label="Needs">
    <div class="bar glass" data-k="food"><img class="px" data-icon="oran" alt=""><div class="bt"><div class="bh"><span class="bl">Food</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="joy"><img class="px" data-icon="heart" alt=""><div class="bt"><div class="bh"><span class="bl">Happy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="ene"><img class="px" data-icon="energy" alt=""><div class="bt"><div class="bh"><span class="bl">Energy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="hyg"><img class="px" data-icon="hygiene" alt=""><div class="bt"><div class="bh"><span class="bl">Hygiene</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
  </section>

  <main id="stage">
    <canvas id="scene"></canvas>
    <div id="cerBtns"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="hint"></div>
    <div id="talk" class="hidden" aria-live="polite">
      <div class="tk-face"><img alt=""></div>
      <div class="tk-box"><div class="tk-name"></div><div class="tk-text"></div><div class="tk-next">▼</div></div>
    </div>
  </main>

  <nav id="actions" class="glass dock">
    <button data-act="feed"><img class="px" data-icon="pecha" alt=""><span>Berries</span></button>
    <button data-act="play"><img class="px" data-icon="pokeball" alt=""><span>Catch</span></button>
    <button data-act="train"><img class="px" data-icon="train" alt=""><span>Train</span></button>
    <button data-act="bath"><img class="px" data-icon="bath" alt=""><span>Bath</span></button>
    <button data-act="light"><img class="px" id="lightIcon" data-icon="sleep" alt=""><span id="lightLbl">Sleep</span></button>
    <button data-act="party"><img class="px" data-icon="party" alt=""><span>Party</span></button>
    <button data-act="dex"><img class="px" data-icon="pokedex" alt=""><span>Dex</span></button>
  </nav>
</div>

<!-- bottom sheet / dialogs -->
<div id="scrim" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>

<!-- full-screen minigames -->
<div id="arena" class="hidden">
  <div class="arena-top">
    <div id="arenaTitle"></div>
    <div id="arenaInfo"></div>
    <button id="arenaClose" class="glass chip icon" aria-label="Stop">✕</button>
  </div>
  <canvas id="arenaCanvas"></canvas>
</div>

<script src="pixelart.js"></script>
<script src="sprites.js"></script>
<script src="backgrounds.js"></script>
<script src="species.js"></script>
<script src="creatures.js"></script>
<script src="game.js"></script>
<script src="talk.js"></script>
<script src="ui.js"></script>
</body>
</html>
