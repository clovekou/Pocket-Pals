<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Pocket Pals">
<title>Pocket Pal</title>
<link rel="manifest" href="manifest.webmanifest">
<script>/* keep the browser's install prompt for the "Add to Home Screen" bar (ui.js) */
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ppInstall = e; });</script>
<link rel="icon" href="icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png?v=2" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=2" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- web fonts load without holding up the first screen (system fonts show until they arrive) -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="style.css">
<script>
// home-screen app: lets the CSS tell it apart from a Safari tab
if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.documentElement.classList.add('standalone');
</script>
</head>
<body>
<div id="app">
  <header id="top">
    <button id="nameBtn" class="glass namechip" aria-label="Open stat card">
      <span class="avatar"><img id="avatar" alt=""></span>
      <span class="nm"><b id="petName">Pocket Pal</b><small id="petSub"></small></span>
      <span id="petLevel" class="lv"></span>
    </button>
    <button id="settingsBtn" class="glass chip icon" aria-label="Settings"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M20.0 9.0 L20.5 3.3 L27.5 3.3 L28.0 9.0 L31.8 10.6 L36.2 6.9 L41.1 11.8 L37.4 16.2 L39.0 20.0 L44.7 20.5 L44.7 27.5 L39.0 28.0 L37.4 31.8 L41.1 36.2 L36.2 41.1 L31.8 37.4 L28.0 39.0 L27.5 44.7 L20.5 44.7 L20.0 39.0 L16.3 37.4 L11.8 41.1 L6.9 36.2 L10.6 31.8 L9.0 28.0 L3.3 27.5 L3.3 20.5 L9.0 20.0 L10.6 16.3 L6.9 11.8 L11.8 6.9 L16.2 10.6z" fill="url(#dkSteel)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="9.5" fill="url(#dkWhite)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M14.5 24a9.5 9.5 0 0 1 19 0z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M14.5 24h19" stroke="#2b2f45" stroke-width="2.5"/>
      <circle cx="24" cy="24" r="3.3" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
      <path d="M12.5 15.5a13 13 0 0 1 4.5-4" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round"/>
    </svg></button>
  </header>

  <section id="bars" aria-label="Needs">
    <div class="bar glass" data-k="food" title="Food" aria-label="Food"><img class="px" data-icon="oran" alt=""><div class="bt"><div class="bh"><span class="bl">Food</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="joy" title="Happy" aria-label="Happy"><img class="px" data-icon="heart" alt=""><div class="bt"><div class="bh"><span class="bl">Happy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="ene" title="Energy" aria-label="Energy"><img class="px" data-icon="energy" alt=""><div class="bt"><div class="bh"><span class="bl">Energy</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
    <div class="bar glass" data-k="hyg" title="Hygiene" aria-label="Hygiene"><img class="px" data-icon="hygiene" alt=""><div class="bt"><div class="bh"><span class="bl">Hygiene</span><span class="bv">0</span></div><div class="track"><i></i></div></div></div>
  </section>

  <main id="stage">
    <canvas id="scene"></canvas>
    <button id="mailBtn" aria-label="Game patch updates"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="12" width="36" height="26" rx="4" fill="#fbf7ea" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M7.5 36l12-11M40.5 36l-12-11" fill="none" stroke="#2b2f45" stroke-width="2" stroke-linecap="round" stroke-opacity=".55"/>
      <path d="M7 14l17 13 17-13" fill="#efe6cf" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="26.5" r="4.6" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2"/>
      <path d="M22.4 26.5h3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".9"/>
    </svg><i id="mailDot" class="hidden"></i></button>
    <!-- quick care, left side: tap Feed to open the berries, then hold one and drag it onto your Pokémon; hold the water and drag it on to wash -->
    <div id="quickCare">
      <button id="feedBtn" class="qc" aria-label="Feed: tap, then drag a berry onto your Pokémon"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 13c1-4.5 4.5-8 9.5-8.5-.4 5-4 8.6-9.5 8.5z" fill="#7be38a" stroke="#2b2f45" stroke-width="2.3" stroke-linejoin="round"/>
        <path d="M24 14.5V10" stroke="#2b2f45" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="24" cy="28.5" r="15" fill="url(#dkBlue)" stroke="#2b2f45" stroke-width="2.5"/>
        <path d="M17.5 22.5a8 8 0 0 1 5-4" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="30" cy="34" r="1.8" fill="#2b2f45" fill-opacity=".35"/><circle cx="20" cy="35.5" r="1.4" fill="#2b2f45" fill-opacity=".35"/>
      </svg><span>Feed</span></button>
      <button id="washBtn" class="qc" aria-label="Wash: hold and drag the water onto your Pokémon"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 4.5C18 14 10.5 21.5 10.5 30a13.5 13.5 0 0 0 27 0C37.5 21.5 30 14 24 4.5z" fill="url(#dkLens)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M17 30.5a7.5 7.5 0 0 0 5 6.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="39.5" cy="11" r="3.2" fill="#d6f3ff" stroke="#2b2f45" stroke-width="1.8"/><circle cx="8" cy="15" r="2.2" fill="#d6f3ff" stroke="#2b2f45" stroke-width="1.6"/>
      </svg><span>Water</span></button>
      <div id="feedTray" class="hidden" role="group" aria-label="Berries: hold one and drag it onto your Pokémon"></div>
    </div>
    <div id="dragGhost" class="hidden" aria-hidden="true"></div>
    <div id="cerBtns"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="hint"></div>
    <div id="talk" class="hidden" aria-live="polite">
      <div class="tk-face"><img alt=""></div>
      <div class="tk-box"><div class="tk-name"></div><div class="tk-text"></div><div class="tk-next">▼</div></div>
    </div>
  </main>

  <nav id="actions" class="glass dock">
    <!-- shared gradients for the dock icons -->
    <svg id="dkDefs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <linearGradient id="dkBag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#f4a62a"/></linearGradient>
      <linearGradient id="dkRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset="1" stop-color="#e2382c"/></linearGradient>
      <linearGradient id="dkBall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f61"/><stop offset="1" stop-color="#e2382c"/></linearGradient>
      <linearGradient id="dkCare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb3cc"/><stop offset=".55" stop-color="#ff5c8a"/><stop offset="1" stop-color="#d9336a"/></linearGradient>
      <linearGradient id="dkGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#c98a1e"/></linearGradient>
      <radialGradient id="dkFace" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde1ee"/></radialGradient>
      <linearGradient id="dkWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d3d8e6"/></linearGradient>
      <linearGradient id="dkBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#535a7e"/><stop offset="1" stop-color="#2f3450"/></linearGradient>
      <linearGradient id="dkSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2e5ef"/><stop offset="1" stop-color="#9aa1b8"/></linearGradient>
      <linearGradient id="dkBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc3ff"/><stop offset="1" stop-color="#3a74d8"/></linearGradient>
      <linearGradient id="dkSkin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6cc"/><stop offset="1" stop-color="#f1b98c"/></linearGradient>
      <radialGradient id="dkLens" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#d6f3ff"/><stop offset=".45" stop-color="#62c9ff"/><stop offset="1" stop-color="#2a86d6"/></radialGradient>
      <linearGradient id="dkScreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fbf1"/><stop offset="1" stop-color="#bfe9d2"/></linearGradient>
    </defs></svg>
    <button data-act="bag" aria-label="Bag"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M18 12.5V9.5a6 6 0 0 1 12 0v3" fill="none" stroke="#2b2f45" stroke-width="3" stroke-linecap="round"/>
      <rect x="8.5" y="11.5" width="31" height="32" rx="9" fill="url(#dkBag)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M8.5 23.5v-3a9 9 0 0 1 9-9h13a9 9 0 0 1 9 9v3z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="15" y="29" width="18" height="9.5" rx="3.5" fill="#fff3cf" stroke="#2b2f45" stroke-width="2.2"/>
      <circle cx="24" cy="23.5" r="3.8" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
      <path d="M13.5 18a5 5 0 0 1 3.5-3" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round"/>
    </svg><span>Bag</span></button>
    <button id="friendsBtn" data-act="friends" aria-label="Friends and trades"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M22.5 43c0-8.5 5-13.5 11.5-13.5S45.5 34.5 45.5 43z" fill="url(#dkBlue)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="34" cy="17" r="7" fill="url(#dkSkin)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M27 16.2a7 7 0 0 1 14 0c-2.4-1.5-4.8-2.1-7-2.1s-4.6.6-7 2.1z" fill="#3b4a7a" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M4 44c0-9.8 5.8-15.5 14-15.5S32 34.2 32 44z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="18" cy="20.5" r="8.3" fill="url(#dkSkin)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M9.7 19.6a8.3 8.3 0 0 1 16.6 0z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M23.5 19.6h3.5" stroke="#2b2f45" stroke-width="3" stroke-linecap="round"/>
      <path d="M15.5 14.8h4.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M9 36.5a7 7 0 0 1 4-4" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round"/>
    </svg><span>Friends</span><i id="friendsBadge" class="badge hidden">0</i></button>
    <button data-act="explore" class="center" aria-label="Explore: dungeon or training"><i class="hub"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="19" fill="url(#dkGold)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="13.8" fill="url(#dkFace)" stroke="#2b2f45" stroke-width="2.2"/>
      <path d="M24 11.8v3M24 33.2v3M11.8 24h3M33.2 24h3" stroke="#2b2f45" stroke-width="2.2" stroke-linecap="round"/>
      <g transform="rotate(35 24 24)"><path d="M24 12.8l4.6 11.2h-9.2z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2" stroke-linejoin="round"/>
      <path d="M24 35.2l4.6-11.2h-9.2z" fill="#3b4a7a" stroke="#2b2f45" stroke-width="2" stroke-linejoin="round"/></g>
      <circle cx="24" cy="24" r="2.5" fill="#fff" stroke="#2b2f45" stroke-width="1.8"/>
      <path d="M10.5 17a15 15 0 0 1 5-6" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.2" stroke-linecap="round"/>
    </svg></i><span>Explore</span></button>
    <button data-act="party" aria-label="Party"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="14.5" cy="16.5" r="10" fill="url(#dkWhite)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M4.5 16.5a10 10 0 0 1 20 0z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M4.5 16.5h20" stroke="#2b2f45" stroke-width="2.5"/><circle cx="14.5" cy="16.5" r="3.4" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
      <circle cx="33.5" cy="16.5" r="10" fill="url(#dkWhite)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M23.5 16.5a10 10 0 0 1 20 0z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M23.5 16.5h20" stroke="#2b2f45" stroke-width="2.5"/><circle cx="33.5" cy="16.5" r="3.4" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
      <circle cx="24" cy="31" r="12.5" fill="url(#dkWhite)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M11.5 31a12.5 12.5 0 0 1 25.0 0z" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/><path d="M11.5 31h25.0" stroke="#2b2f45" stroke-width="2.5"/><circle cx="24" cy="31" r="4.2" fill="#fff" stroke="#2b2f45" stroke-width="2.2"/>
    </svg><span>Party</span></button>
    <button data-act="dex" aria-label="Pokédex"><svg class="dk" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="8.5" y="4.5" width="31" height="39" rx="6.5" fill="url(#dkRed)" stroke="#2b2f45" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="16" cy="11.5" r="4" fill="url(#dkLens)" stroke="#2b2f45" stroke-width="2.2"/>
      <circle cx="23.8" cy="10" r="1.7" fill="#ff9a8a" stroke="#2b2f45" stroke-width="1.2"/><circle cx="28.3" cy="10" r="1.7" fill="#ffd86b" stroke="#2b2f45" stroke-width="1.2"/><circle cx="32.8" cy="10" r="1.7" fill="#7be38a" stroke="#2b2f45" stroke-width="1.2"/>
      <rect x="13.5" y="18.5" width="21" height="15" rx="3" fill="url(#dkScreen)" stroke="#2b2f45" stroke-width="2.2"/>
      <circle cx="24" cy="26" r="4.2" fill="none" stroke="#3f9a78" stroke-width="2"/><path d="M19.8 26h8.4" stroke="#3f9a78" stroke-width="2"/>
      <path d="M15 38.5h7" stroke="#2b2f45" stroke-width="2.6" stroke-linecap="round"/><circle cx="31.5" cy="38.5" r="2.3" fill="#2b2f45"/>
    </svg><span>Dex</span></button>
  </nav>
</div>

<!-- bottom sheet / dialogs -->
<div id="scrim" class="hidden"></div>
<div id="sheet" class="hidden" role="dialog" aria-modal="true"></div>

<!-- full-screen minigames -->
<div id="arena" class="hidden">
  <div class="arena-top">
    <div id="arenaTitle"></div>
    <div id="arenaInfo"></div>
    <button id="arenaClose" class="glass chip icon" aria-label="Stop">✕</button>
  </div>
  <canvas id="arenaCanvas"></canvas>
  <div id="arenaPanel" class="hidden"><div class="ep-msg" id="epMsg"></div><div class="ep-btns" id="epBtns"></div></div>
</div>

<script>window.PP_PREVIEW = /[?&]preview\b/.test(location.search); // ?preview = sample team, offline, separate save</script>
<script src="version.js"></script>
<script src="patchnotes.js"></script>
<script src="items.js"></script>
<script src="evodata.js"></script>
<script src="species.js"></script>
<script src="evolution.js"></script>
<script src="pixelart.js"></script>
<script src="sprites.js"></script>
<script src="backgrounds.js"></script>
<script src="creatures.js"></script>
<script src="maps.js"></script>
<script src="game.js"></script>
<script src="online-config.js"></script>
<script src="online.js"></script>
<script src="talk.js"></script>
<script src="ui.js"></script>
</body>
</html>
